# chili3d — o app Chili3D, servido, com o /v1/ encaminhado para o relay de IA.
#
# Um serviço, uma imagem. O que existia antes — um núcleo Python com API, MCP,
# registro de peças e validação FDM, mais um container com Chromium headless,
# ponte WebSocket e companheiro CDP — saiu. O deploy é o Chili3D como vem do
# commit fixado em chili3d.ref, mais um único adicional: o proxy de /v1/, que é a
# correção do "Erro: Connection error." (ver docs/assistente-relay.md).
#
# Imagem ghcr.io/brook-sys/chili3d:main, publicada pelo workflow a cada push na
# main. O host Docker não compila nada: só faz o pull.
#
# Nada de volume: o container é stateless e o app é estático. Reiniciar não perde
# nada, e não há semeadura de registro nem navegador para esperar.

services:
  chili3d:
    image: ghcr.io/brook-sys/chili3d:main
    container_name: chili3d
    restart: unless-stopped
    pull_policy: always
    environment:
      # Porta em que o processo escuta DENTRO do container. Não costuma mudar.
      PORT: ${PORT:-8080}
      # Raiz do relay de IA, sem /v1: o /v1 é este servidor que põe, e um baseURL
      # com /v1 pediria /v1/v1/... no relay.
      #
      # O default http://9router:20128 é o alias do relay na rede aiNetwork. Troque
      # aqui se o relay tiver outro endereço na sua rede.
      RELAY_URL: ${RELAY_URL:-http://9router:20128}
      # Origem devolvida nos cabeçalhos CORS deste servidor. `*` é o que o relay
      # faz, e é seguro aqui: a chave não passa por cookie nem por sessão, só
      # pelo header authorization que o próprio usuário colou no assistente.
      CORS_ORIGEM: ${CORS_ORIGEM:-*}
    # Porta publicada parametrizada de propósito: durante a troca da stack antiga
    # pela nova, as duas coexistem e a 8080 fica ocupada. Sobe com
    # PORTA_APP=8081, e volta a 8080 quando a antiga sair.
    ports:
      - "${PORTA_APP:-8080}:8080"
    networks:
      - chili3d
      # Externa: criada e usada pela stack do relay. Entrar nela é o que permite
      # falar com o relay pelo nome, sem depender de porta publicada.
      - aiNetwork
    healthcheck:
      # O Dockerfile já traz um; esta linha documenta o intervalo em uso.
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  chili3d:
    name: chili3d
  aiNetwork:
    external: true
