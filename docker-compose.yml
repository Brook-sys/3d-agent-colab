# 3D Agent Colab — núcleo (core) + sessão (session).
#
# Imagens ghcr.io/brook-sys/3d-agent-colab-{core,session}:main, publicadas pelo
# workflow a cada push na main. O host Docker não compila nada: só faz o pull.
#
# Os diretórios de dados precisam existir no host antes do primeiro deploy:
#   mkdir -p /opt/3d-agent-colab/parts /opt/3d-agent-colab/session
#   chown 1000:1000 /opt/3d-agent-colab/parts      # o núcleo roda como uid 1000

services:
  core:
    image: ghcr.io/brook-sys/3d-agent-colab-core:main
    container_name: 3d-agent-colab-core
    restart: unless-stopped
    pull_policy: always
    working_dir: /app
    environment:
      PARTS_ROOT: ${PARTS_ROOT:-/parts}
      BRIDGE_URL: ${BRIDGE_URL:-http://session:17400}
      PORT: ${PORT:-9001}
      PRINTER_MODEL: ${PRINTER_MODEL:-Elegoo Neptune 4}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      FONTE_URL: ${FONTE_URL:-}
    volumes:
      - /opt/3d-agent-colab/parts:/parts
    # 9001 publicada duas vezes: 8080 é o endereço do app no navegador, e o
    # painel dentro do app chama o núcleo em http://<host>:9001 (fallback de
    # extension.js) quando a URL não traz api=. Não é redundância, é o que
    # faz o painel funcionar nos dois acessos.
    ports:
      - "8080:9001"
      - "9001:9001"
    networks: [3d-agent-colab]

  session:
    image: ghcr.io/brook-sys/3d-agent-colab-session:main
    container_name: 3d-agent-colab-session
    restart: unless-stopped
    pull_policy: always
    init: true
    shm_size: "1gb"
    environment:
      BRIDGE_PORT: ${BRIDGE_PORT:-17373}
      BRIDGE_HTTP_PORT: ${BRIDGE_HTTP_PORT:-17400}
      BRIDGE_DATA_DIR: ${BRIDGE_DATA_DIR:-/data}
      KIOSK_URL: ${KIOSK_URL:-http://core:9001/?bridge=&plugin=http://core:9001/painel/&part=espacador&painel=1}
      FONTE_URL: ${FONTE_URL:-}
    volumes:
      - /opt/3d-agent-colab/session:/data
    # Sem ports de propósito: a ponte é controle remoto sem autenticação sobre
    # o navegador do kiosk, e só o núcleo precisa dela — pela rede interna.
    # Para recarregar o kiosk use POST /kiosk/recarregar no núcleo (8080).
    networks: [3d-agent-colab]

networks:
  3d-agent-colab:
    name: 3d-agent-colab
