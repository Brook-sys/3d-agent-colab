# 3D Agent Colab — núcleo (core) + sessão (session).
#
# Imagens ghcr.io/brook-sys/3d-agent-colab-{core,session}:main, publicadas pelo
# workflow a cada push na main. O host Docker não compila nada: só faz o pull.
#
# Os diretórios de dados precisam existir no host antes do primeiro deploy:
#   mkdir -p /opt/3d-agent-colab/parts /opt/3d-agent-colab/session
#   chown 1000:1000 /opt/3d-agent-colab/parts      # o núcleo roda como uid 1000

services:
  core:
    image: ghcr.io/brook-sys/3d-agent-colab-core:main
    container_name: 3d-agent-colab-core
    restart: unless-stopped
    pull_policy: always
    working_dir: /app
    environment:
      PARTS_ROOT: ${PARTS_ROOT:-/parts}
      BRIDGE_URL: ${BRIDGE_URL:-http://session:17400}
      PORT: ${PORT:-9001}
      PRINTER_MODEL: ${PRINTER_MODEL:-Elegoo Neptune 4}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      FONTE_URL: ${FONTE_URL:-}
      # Endereço do relay de IA que o assistente nativo do Chili3D usa. Sem
      # default que resolva: é dado do ambiente do usuário (endereço de rede
      # real não vai para arquivo versionado). Com ele definido, o assistente
      # aponta para http://SEU-HOST:8080/relay — SEM /v1, porque o /v1 já
      # está aqui: o proxy monta RELAY_URL/<caminho>, e um baseURL com /v1
      # pediria /v1/v1/... no relay. A chamada sai pela MESMA origem da
      # página — sem CORS no meio. A chave continua sendo colada no painel
      # do assistente e vem no header de cada pedido; o núcleo não a guarda.
      RELAY_URL: ${RELAY_URL:-}
    volumes:
      - /opt/3d-agent-colab/parts:/parts
    # 9001 publicada duas vezes: 8080 é o endereço do app no navegador. A API
    # (REST e MCP) fica em 9001, que é o que o opencode.json do projeto usa.
    ports:
      - "8080:9001"
      - "9001:9001"
    networks: [3d-agent-colab]

  session:
    image: ghcr.io/brook-sys/3d-agent-colab-session:main
    container_name: 3d-agent-colab-session
    restart: unless-stopped
    pull_policy: always
    init: true
    shm_size: "1gb"
    environment:
      BRIDGE_PORT: ${BRIDGE_PORT:-17373}
      BRIDGE_HTTP_PORT: ${BRIDGE_HTTP_PORT:-17400}
      BRIDGE_DATA_DIR: ${BRIDGE_DATA_DIR:-/data}
      # Só o `?bridge=`: a página conecta de volta na ponte deste container, e
      # é por ela que o agente externo dirige o documento. Nenhum plugin é
      # carregado — o deploy é o Chili3D como vem do commit fixado.
      KIOSK_URL: ${KIOSK_URL:-http://core:9001/?bridge=}
      FONTE_URL: ${FONTE_URL:-}
    volumes:
      - /opt/3d-agent-colab/session:/data
    # Sem ports de propósito: a ponte é controle remoto sem autenticação sobre
    # o navegador do kiosk, e só o núcleo precisa dela — pela rede interna.
    # Para recarregar o kiosk use POST /kiosk/recarregar no núcleo (8080).
    networks: [3d-agent-colab]

networks:
  3d-agent-colab:
    name: 3d-agent-colab
