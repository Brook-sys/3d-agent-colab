# Teste local: builda com ./deploy/build-local.sh e sobe a stack com a imagem
# local em vez da do GHCR.
#
#   docker compose -f docker-compose.yml -f deploy/compose.local.yml up -d
#
# `pull_policy: never` é o ponto: sem ele, o compose tentaria baixar
# chili3d-dev:dev do GHCR, onde essa tag não existe.
services:
  chili3d:
    image: chili3d-dev:dev
    pull_policy: never
