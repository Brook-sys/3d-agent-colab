# Teste local: builda com ./deploy/build-local.sh e sobe a stack com as imagens
# locais em vez das do GHCR.
#
#   docker compose -f docker-compose.yml -f deploy/compose.local.yml up -d
#
# `pull_policy: never` é o ponto: sem ele, o compose tentaria baixar
# 3d-agent-colab-<nome>:dev do GHCR, onde essas tags não existem.
services:
  core:
    image: 3d-agent-colab-core:dev
    pull_policy: never

  session:
    image: 3d-agent-colab-session:dev
    pull_policy: never
