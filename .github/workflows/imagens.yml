name: imagens

# Constrói e publica as três imagens no GHCR. É o caminho oficial: o
# docker-compose.yml aponta para ghcr.io e o Portainer só faz o pull.
#
#   web     nginx: Chili3D compilado do commit fixado em chili3d.ref + painel
#   session Playwright/Chromium headless + ponte WebSocket
#   core    Python 3.12 + build123d + API/MCP
#
# Gatilho: push na main que mexa em algo que entre nas imagens, ou disparo
# manual. Nada aqui é destrutivo — se o build quebrar, a imagem anterior
# continua no GHCR e a stack roda com ela.

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "session/**"
      - "web/**"
      - "plugin-flow/**"
      - "partes/**"
      - "chili3d.ref"
      - ".github/workflows/imagens.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# O GHCR exige minúsculas no caminho, e as expressões do Actions não têm
# `lower()`. `github.repository` devolve "Brook-sys/3d-agent-colab", com B
# maiúsculo, e o buildx rejeita a tag. Por isso o caminho é literal: se a conta
# mudar de nome, é aqui que se mexe.
env:
  IMAGEM: ghcr.io/brook-sys/3d-agent-colab

concurrency:
  group: imagens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: core
            titulo: núcleo (API + MCP)
          - nome: session
            titulo: sessão (ponte + kiosk)
          - nome: web
            titulo: site (nginx + Chili3D)
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: buildx
        uses: docker/setup-buildx-action@v3

      - name: login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Duas tags: `main` (o que o compose usa) e `sha-...` (fixa uma versão
      # para poder voltar atrás sem rebuildar).
      - name: build e push da imagem ${{ matrix.nome }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.nome }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGEM }}/${{ matrix.nome }}:main
            ${{ env.IMAGEM }}/${{ matrix.nome }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,scope=${{ matrix.nome }},mode=max

      # Pacote do GHCR nasce PRIVADO. Sem este passo, o host Docker precisaria de
      # credencial (docker login) para puxar, e a stack do Portainer não subiria
      # imagem nova. O conteúdo já é público — o repo é público e o Chili3D
      # também —, então não há nada a esconder aqui.
      #
      # O GITHUB_TOKEN do Actions traz packages:write, que é o que a PATCH exige.
      # O 404 é tolerante: o pacote pode levar alguns segundos para aparecer na
      # API depois do push, e falhar aqui não deve derrubar um build que deu
      # certo — o aviso manda acertar à mão em Configurar acesso do pacote.
      - name: pacote público no GHCR
        run: |
          sleep 8
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/3d-agent-colab%2F${{ matrix.nome }}" \
            -d '{"visibility":"public"}' \
            && echo "pacote ${{ matrix.nome }} público" \
            || echo "AVISO: não foi possível tornar ${{ matrix.nome }} público — ajuste em Configurar acesso do pacote"
