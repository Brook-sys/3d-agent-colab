name: imagens

# Constrói e publica as duas imagens no GHCR. É o caminho oficial: o
# docker-compose.yml aponta para ghcr.io e o Portainer só faz o pull.
#
#   core    Python 3.12 + build123d + API/MCP + o app Chili3D e o painel (estático)
#   session Playwright/Chromium headless + ponte WebSocket
#
# Era três imagens: havia uma de nginx só para servir os arquivos estáticos. Ela
# saiu — o núcleo passou a servir o app e o painel (ver o bloco "estático" no
# fim de core/main.py), o que também satisfaz de graça a regra do PluginManager,
# que exige que `?plugin=` tenha o mesmo host da página.
#
# Gatilho: push na main que mexa em algo que entre nas imagens, ou disparo
# manual. Nada aqui é destrutivo — se o build quebrar, a imagem anterior
# continua no GHCR e a stack roda com ela.

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "session/**"
      - "painel/**"
      - "partes/**"
      - "chili3d.ref"
      - ".github/workflows/imagens.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# O GHCR exige minúsculas no caminho, e as expressões do Actions não têm
# `lower()`. `github.repository` devolve "Brook-sys/3d-agent-colab", com B
# maiúsculo, e o buildx rejeita a tag. Por isso o caminho é literal: se a conta
# mudar de nome, é aqui que se mexe.
#
# O pacote leva HÍFEN, não barra: `3d-agent-colab-core`. As duas convenções
# existem no GHCR e escolhemos o hífen por ser o que o picofarm e o
# orca-slicer-api já usam. A consequência prática é que a URL da API leva o
# nome do pacote "escapado" — veja o passo de visibilidade abaixo.
env:
  IMAGEM: ghcr.io/brook-sys/3d-agent-colab

concurrency:
  group: imagens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: core
            titulo: núcleo (API + MCP + app e painel)
          - nome: session
            titulo: sessão (ponte + kiosk)
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # O painel é JavaScript puro sem build: ele entra na imagem por COPY e
      # roda no navegador do kiosk. Um erro de sintaxe ou de referência não
      # quebra o build do Docker — quebra o plugin em silêncio (a página abre,
      # o painel não aparece, e o console é a única testemunha). Foi assim que
      # `constbotaoIa` passou uma revisão inteira: `node --check` aceita, porque
      # aquilo é um identificador válido; o `appendChild(constbotaoIa)` é que
      # morreria, dentro do `buildPanel()`, depois do `COPY`.
      #
      # `node --check` pega sintaxe, e é barato. Referência solta ele NÃO pega
      # — para isso existe a verificação pós-deploy (o log `[painel] painel
      # ativo` no chrome.log do kiosk). O que este passo garante é que o CI
      # fica vermelho no erro grosseiro, antes de a imagem ser publicada.
      - name: sintaxe do painel e do manifest
        run: |
          node --check painel/src/extension.js
          node -e "JSON.parse(require('fs').readFileSync('painel/manifest.json','utf8')); console.log('manifest ok')"
          node --check session/bridge-server.mjs
          node --check session/kiosk-cdp.mjs

      - name: buildx
        uses: docker/setup-buildx-action@v3

      - name: login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Duas tags: `main` (o que o compose usa) e `sha-...` (fixa uma versão
      # para poder voltar atrás sem rebuildar).
      - name: build e push da imagem ${{ matrix.nome }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.nome }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGEM }}-${{ matrix.nome }}:main
            ${{ env.IMAGEM }}-${{ matrix.nome }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,scope=${{ matrix.nome }},mode=max

      # Pacote do GHCR nasce PRIVADO. Sem torná-lo público, o host Docker precisa
      # de credencial (docker login) para puxar, e a stack do Portainer não sobe
      # imagem nova. O conteúdo já é público — o repo é público e o Chili3D
      # também —, então não há nada a esconder aqui.
      #
      # O GITHUB_TOKEN do Actions traz packages:write, que é o que a PATCH exige.
      #
      # Sobre a URL: como o pacote usa hífen, o nome NÃO precisa de percent-encode
      # (`3d-agent-colab%2Fcore` seria a variante com barra, e dá 404 aqui).
      #
      # Duas coisas que o primeiro run desta fase ensinou:
      #   1. um `sleep 8` não é suficiente — o pacote pode levar mais para
      #      aparecer na API depois do push, e o PATCH devolve 404;
      #   2. o PATCH com 200 NÃO prova que o pacote é público (ele pode já ter
      #      sido), e o 404 não falha o build.
      # Por isso o passo termina no teste que importa: um pull ANÔNIMO do
      # manifesto. É exatamente assim que o host Docker puxa — sem credencial.
      # Sem essa verificação, um build verde com pacote privado passa e a stack
      # do Portainer não recria nada, em silêncio.
      - name: pacote público no GHCR
        run: |
          PACOTE="3d-agent-colab-${{ matrix.nome }}"
          patch="sem-efeito"
          for tentativa in 1 2 3 4 5; do
              if curl -fsSL -X PATCH \
                   -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                   -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/user/packages/container/$PACOTE" \
                   -d '{"visibility":"public"}' >/dev/null; then
                  patch="ok"
                  break
              fi
              echo "tentativa $tentativa: PATCH falhou — aguardando o pacote aparecer na API"
              sleep 10
          done

          TOKEN="$(curl -fsSL "https://ghcr.io/token?scope=repository:brook-sys/$PACOTE:pull&service=ghcr.io" \
                   | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')"
          if curl -fsSL -o /dev/null \
               -H "Authorization: Bearer $TOKEN" \
               -H "Accept: application/vnd.oci.image.index.v1+json" \
               "https://ghcr.io/v2/brook-sys/$PACOTE/manifests/main"; then
              echo "pacote $PACOTE público — pull anônimo OK (PATCH: $patch)"
          else
              echo "::error title=Pacote $PACOTE não está público::o pull anônimo falhou; o host Docker não puxa sem docker login. Ajuste em Configurar acesso do pacote."
              exit 1
          fi
