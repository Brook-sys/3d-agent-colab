server {
    listen 80;
    server_name _;

    # Chili3D compilado (rspack) na raiz.
    location / {
        root /usr/share/nginx/html/dist;
        try_files $uri $uri/ /index.html;
    }

    # O painel colaborativo é um plugin carregado por ?plugin=/flow/.
    # O carregador do Chili3D exige que a URL do plugin tenha o MESMO host da
    # página, por isso ele mora no mesmo servidor.
    #
    # `^~` é obrigatório: sem ele, a `location` de regex abaixo (js/css) captura
    # `src/extension.js` antes e o plugin 404a.
    # `alias` (e não `root`) porque o caminho no disco não repete o prefixo da URI.
    location ^~ /flow/ {
        alias /usr/share/nginx/html/flow/;
        add_header Cache-Control "no-store" always;
    }

    # O wasm e os chunks são grandes e imutáveis: cache longo.
    # A regex NÃO vale para /flow/ (ver o `^~` acima).
    location ~* \.(wasm|js|css)$ {
        root /usr/share/nginx/html/dist;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
